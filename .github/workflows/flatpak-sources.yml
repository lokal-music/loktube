name: Flatpak dependency source generation

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "package.json"
      - "pnpm-lock.yaml"
      - "packaging/flatpak/**"
      - ".github/workflows/flatpak-sources.yml"

permissions:
  contents: read

concurrency:
  group: flatpak-sources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Generate pinned Flatpak sources
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install flatpak-node-generator
        run: |
          python -m pip install --user pipx
          python -m pipx ensurepath
          ~/.local/bin/pipx install "git+https://github.com/flatpak/flatpak-builder-tools.git#subdirectory=node"

      - name: Generate pnpm sources
        run: |
          ~/.local/bin/flatpak-node-generator pnpm pnpm-lock.yaml \
            --pnpm-store-version v11 \
            --electron-ffmpeg archive \
            --output packaging/flatpak/generated-sources.json

      - name: Validate AppStream metadata
        run: |
          sudo apt-get update
          sudo apt-get install --yes appstream
          appstreamcli validate packaging/flatpak/com.riberojuanca.worldtube.metainfo.xml

      - name: Upload generated source manifest
        uses: actions/upload-artifact@v4
        with:
          name: loktube-flatpak-generated-sources
          path: packaging/flatpak/generated-sources.json
          if-no-files-found: error
          retention-days: 14
