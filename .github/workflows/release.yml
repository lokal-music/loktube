name: Prepare release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    # Explicit release-marked main commits publish the version in package.json.
    # Other main pushes do not trigger a release.
    if: ${{ github.event_name == 'workflow_dispatch' || github.ref_type == 'tag' || (github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      published: ${{ steps.draft.outputs.published }}
      ready_assets: ${{ steps.assets.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Require license and recorded technical review
        run: |
          if [ ! -f LICENSE ] || [ ! -f .github/DISTRIBUTION_REVIEW.md ]; then
            echo "A project license and recorded technical review are required."
            exit 1
          fi
      - name: Resolve release version
        id: version
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          if [ "$REF_TYPE" = "tag" ] && [ "$REF_NAME" != "$TAG" ]; then
            echo "The tag must match package.json: $TAG"
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
      - name: Prepare draft
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            DRAFT=$(gh release view "$TAG" --json isDraft --jq .isDraft)
            if [ "$DRAFT" != "true" ]; then
              echo "published=true" >> "$GITHUB_OUTPUT"
              echo "This version is already published; keeping its existing assets."
              exit 0
            fi
          else
            NOTES=".github/release-notes/$TAG.md"
            if [ -f "$NOTES" ]; then
              gh release create "$TAG" --draft --title "LokTube ${TAG#v}" --notes-file "$NOTES" --target "$GITHUB_SHA"
            else
              gh release create "$TAG" --draft --title "LokTube ${TAG#v}" --generate-notes --target "$GITHUB_SHA"
            fi
          fi
      - name: Reuse completed installer uploads when resuming a draft
        id: assets
        if: steps.draft.outputs.published != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          for NAME in "LokTube-$VERSION-win-x64.exe" "LokTube-$VERSION-linux-x86_64.AppImage" "LokTube-$VERSION-linux-amd64.deb"; do
            if ! printf '%s\n' "$ASSETS" | grep -Fxq "$NAME"; then exit 0; fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"
          echo "Existing Windows and Linux installers verified; resuming draft without rebuilding them."

  package:
    needs: prepare
    if: needs.prepare.outputs.published != 'true' && needs.prepare.outputs.ready_assets != 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global corepack --force
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: Ensure Electron runtime and license files are installed
        run: node node_modules/electron/install.js
      - name: Package and upload to draft
        run: pnpm release --x64
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v4
        with:
          name: loktube-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: error

  mac:
    needs: prepare
    if: needs.prepare.outputs.published != 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            machine: arm64
          - runner: macos-15-intel
            arch: x64
            machine: x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Verify release architecture and version
        shell: bash
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          MACHINE: ${{ matrix.machine }}
        run: |
          test "$(uname -m)" = "$MACHINE"
          test "v$(node -p "require('./package.json').version")" = "$TAG"
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install --global corepack --force
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: node node_modules/electron/install.js
      - name: Typecheck and unit tests
        run: |
          pnpm typecheck
          pnpm test
      - name: Package macOS DMG and ZIP
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -euo pipefail
          SIGNING_CREDENTIALS=0
          for ITEM in "$CSC_LINK" "$CSC_KEY_PASSWORD" "$APPLE_ID" "$APPLE_APP_SPECIFIC_PASSWORD" "$APPLE_TEAM_ID"; do
            if [ -n "$ITEM" ]; then SIGNING_CREDENTIALS=$((SIGNING_CREDENTIALS+1)); fi
          done
          if [ "$SIGNING_CREDENTIALS" = 5 ]; then
            echo "Apple Developer ID credentials configured; signing/notarization requested."
            pnpm package --"$ARCH"
          elif [ "$SIGNING_CREDENTIALS" = 0 ]; then
            echo "No Apple signing credentials: packaging an ad-hoc signed Mac build."
            pnpm package --"$ARCH" -c.mac.identity=- -c.mac.hardenedRuntime=false
          else
            echo "Incomplete Apple signing credentials: require all five or none." >&2
            exit 1
          fi
      - name: Verify native signature and packaged macOS application startup
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          MACHINE: ${{ matrix.machine }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          test -s "release/LokTube-$VERSION-mac-$ARCH.dmg"
          test -s "release/LokTube-$VERSION-mac-$ARCH.zip"
          APP="$(find release -type d -name LokTube.app -print -quit)"
          test -n "$APP"
          test -x "$APP/Contents/MacOS/LokTube"
          file "$APP/Contents/MacOS/LokTube" | grep -q "$MACHINE"
          codesign --verify --deep --strict "$APP"
          APP_EXE="$PWD/$APP/Contents/MacOS/LokTube" node <<'NODE'
          const assert = require('node:assert/strict')
          const { _electron: electron } = require('playwright')
          ;(async () => {
            const app = await electron.launch({ executablePath: process.env.APP_EXE, timeout: 60000 })
            try {
              const page = await app.firstWindow()
              await page.locator('.wt-app-shell').waitFor({ timeout: 45000 })
              await page.getByRole('link', { name: 'YouTube account', exact: true }).waitFor({ timeout: 45000 })
              assert.match(await page.title(), /LokTube/)
              console.log('PASS: native macOS packaged app launches and renders')
            } finally {
              await app.close()
            }
          })().catch(error => { console.error(error); process.exitCode = 1 })
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: loktube-mac-${{ matrix.arch }}
          path: |
            release/LokTube-*-mac-${{ matrix.arch }}.dmg
            release/LokTube-*-mac-${{ matrix.arch }}.zip
          compression-level: 0
          if-no-files-found: error

  mac_upload:
    needs: [prepare, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: loktube-mac-*
          path: mac-installers
      - name: Verify installers and upload both macOS architectures to draft
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          for ARCH in arm64 x64; do
            test -s "mac-installers/loktube-mac-$ARCH/LokTube-$VERSION-mac-$ARCH.dmg"
            test -s "mac-installers/loktube-mac-$ARCH/LokTube-$VERSION-mac-$ARCH.zip"
          done
          gh release upload "$TAG" mac-installers/*/*.dmg mac-installers/*/*.zip --clobber
          for ARCH in arm64 x64; do
            gh release view "$TAG" --json assets --jq '.assets[].name' |
              grep -Fx "LokTube-$VERSION-mac-$ARCH.dmg"
          done
      - name: Document Mac signing and Gatekeeper behavior
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          NOTES="$(gh release view "$TAG" --json body --jq .body)"
          if ! grep -Fq 'Mac installer signing' <<<"$NOTES"; then
            printf '%s\n\n' "$NOTES" > mac-notes.txt
            cat >> mac-notes.txt <<'NOTES'
          ## Mac installer signing

          Apple Silicon and Intel DMG/ZIP installers are included. Developer ID signing
          and notarization are used only when the corresponding Apple credentials
          are configured. Otherwise, installers are ad-hoc signed and not notarized:
          macOS may require explicit approval under System Settings → Privacy &
          Security → Open Anyway. Mac auto-updates require Developer ID signing.
          NOTES
            gh release edit "$TAG" --notes-file mac-notes.txt
          fi

  publish:
    needs: [prepare, package, mac, mac_upload]
    if: always() && needs.prepare.outputs.published != 'true' && needs.prepare.result == 'success' && (needs.package.result == 'success' || (needs.package.result == 'skipped' && needs.prepare.outputs.ready_assets == 'true')) && needs.mac.result == 'success' && needs.mac_upload.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - name: Include corresponding source and publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
          READY_ASSETS: ${{ needs.prepare.outputs.ready_assets }}
        run: |
          if [ "$READY_ASSETS" != "true" ]; then
            git archive --format=tar.gz --prefix="LokTube-$TAG/" HEAD -o "LokTube-$TAG-source.tar.gz"
            gh release upload "$TAG" "LokTube-$TAG-source.tar.gz" --clobber
          fi
          python3 - <<'PY'
          from zipfile import ZipFile, ZIP_DEFLATED
          from pathlib import Path
          with ZipFile('LokTube-Zen-UNSIGNED.xpi', 'w', ZIP_DEFLATED) as archive:
              for file in sorted(Path('browser-extension').iterdir()):
                  if file.is_file():
                      archive.write(file, file.name)
          PY
          gh release upload "$TAG" "LokTube-Zen-UNSIGNED.xpi" --clobber
      - name: Sign Zen extension with Mozilla AMO (optional)
        if: ${{ env.AMO_JWT_ISSUER != '' && env.AMO_JWT_SECRET != '' }}
        continue-on-error: true
        env:
          AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
          AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          npm install --global web-ext@8
          node -e "const fs=require('node:fs');const p='browser-extension/manifest.json';const m=JSON.parse(fs.readFileSync(p,'utf8'));m.version=require('./package.json').version;fs.writeFileSync(p,JSON.stringify(m,null,2));"
          web-ext sign --source-dir browser-extension --artifacts-dir firefox-signed --channel unlisted --api-key "$AMO_JWT_ISSUER" --api-secret "$AMO_JWT_SECRET"
          find firefox-signed -name '*.xpi' -type f -print -quit | xargs -r -I {} cp '{}' 'LokTube-Zen-signed.xpi'
          test -s 'LokTube-Zen-signed.xpi'
          gh release upload "$TAG" "LokTube-Zen-signed.xpi" --clobber
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release edit "$TAG" --draft=false
