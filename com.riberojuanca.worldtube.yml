app-id: com.riberojuanca.worldtube
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
base: org.electronjs.Electron2.BaseApp
base-version: '26.08'
sdk-extensions:
  - org.freedesktop.Sdk.Extension.node22
command: run.sh
separate-locales: false

finish-args:
  - --share=ipc
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.freedesktop.portal.*
  - --env=ELECTRON_OZONE_PLATFORM_HINT=auto
  - --env=XCURSOR_PATH=/run/host/user-share/icons:/run/host/share/icons

build-options:
  append-path: /usr/lib/sdk/node22/bin:/run/build/loktube/flatpak-node/pnpm
  env:
    NPM_CONFIG_LOGLEVEL: info

modules:
  - name: loktube
    buildsystem: simple
    build-options:
      env:
        XDG_CACHE_HOME: /run/build/loktube/flatpak-node/cache
        npm_config_cache: /run/build/loktube/flatpak-node/npm-cache
        electron_config_cache: /run/build/loktube/flatpak-node/cache/electron
        npm_config_offline: 'true'
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        COREPACK_HOME: /run/build/loktube/flatpak-node/corepack
    build-commands:
      - pnpm install --offline --frozen-lockfile
      - pnpm run notices
      - pnpm run build
      - node scripts/bundle-botguard.mjs
      - pnpm exec electron-builder --linux dir --x64 --publish never
      - install -d /app/lib/loktube
      - cp -a release/linux-unpacked/. /app/lib/loktube/
      - install -Dm755 packaging/flatpak/run.sh /app/bin/run.sh
      - install -Dm644 packaging/flatpak/com.riberojuanca.worldtube.desktop /app/share/applications/com.riberojuanca.worldtube.desktop
      - install -Dm644 resources/icons/512x512.png /app/share/icons/hicolor/512x512/apps/com.riberojuanca.worldtube.png
      - install -Dm644 packaging/flatpak/com.riberojuanca.worldtube.metainfo.xml /app/share/metainfo/com.riberojuanca.worldtube.metainfo.xml
      - install -Dm644 LICENSE /app/share/licenses/com.riberojuanca.worldtube/LICENSE
      - install -Dm644 COPYRIGHT.txt /app/share/licenses/com.riberojuanca.worldtube/COPYRIGHT.txt
      - install -Dm644 build/third-party/DEPENDENCY_LICENSES.txt /app/share/licenses/com.riberojuanca.worldtube/DEPENDENCY_LICENSES.txt
      - install -Dm644 build/third-party/ASSET_LICENSES.txt /app/share/licenses/com.riberojuanca.worldtube/ASSET_LICENSES.txt
      - install -Dm644 build/third-party/Electron-LICENSE.txt /app/share/licenses/com.riberojuanca.worldtube/Electron-LICENSE.txt
      - install -Dm644 build/third-party/LICENSES.chromium.html /app/share/licenses/com.riberojuanca.worldtube/LICENSES.chromium.html
      - install -Dm644 THIRD_PARTY_NOTICES.md /app/share/licenses/com.riberojuanca.worldtube/THIRD_PARTY_NOTICES.md
    sources:
      - type: dir
        path: .
      - type: archive
        url: https://github.com/pnpm/pnpm/releases/download/v12.4.1/pnpm-linux-x64.tar.gz
        sha256: 66e9886299085dade56e203ae0e3586f35787f8801a68d33ec07ac17b0de2001
        strip-components: 0
        dest: flatpak-node/pnpm
      - packaging/flatpak/generated-sources.json
